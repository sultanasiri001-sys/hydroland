services:
  - type: web
    name: hydroland-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: STORMGLASS_API_KEY
        sync: false
      - key: HYDROLAND_INTEGRATION_WEATHER_MARINE_STATUS
        sync: false
      - key: WEB_ORIGIN
        value: https://sultanasiri001-sys.github.io
