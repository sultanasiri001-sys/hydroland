services:
  - type: web
    name: hydroland-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: STORMGLASS_API_KEY
        sync: false
      - key: HYDROLAND_INTEGRATION_WEATHER_MARINE_STATUS
        sync: false
      - key: HYDROLAND_INTEGRATION_EMAIL_STATUS
        sync: false
      - key: HYDROLAND_EMAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: HYDROLAND_EMAIL_FROM
        sync: false
      - key: HYDROLAND_INTEGRATION_PAYMENT_PSP_STATUS
        sync: false
      - key: HYDROLAND_PAYMENT_PROVIDER
        sync: false
      - key: MOYASAR_SECRET_KEY
        sync: false
      - key: MOYASAR_WEBHOOK_SECRET
        sync: false
      - key: HYDROLAND_INTEGRATION_BANKING_SETTLEMENT_STATUS
        sync: false
      - key: HYDROLAND_SETTLEMENT_PROVIDER
        sync: false
      - key: HYDROLAND_INTEGRATION_SMS_STATUS
        sync: false
      - key: HYDROLAND_SMS_PROVIDER
        sync: false
      - key: UNIFONIC_SMS_APPSID
        sync: false
      - key: UNIFONIC_SMS_SENDER_ID
        sync: false
      - key: HYDROLAND_INTEGRATION_WHATSAPP_STATUS
        sync: false
      - key: HYDROLAND_WHATSAPP_PROVIDER
        sync: false
      - key: UNIFONIC_WHATSAPP_PUBLIC_ID
        sync: false
      - key: UNIFONIC_WHATSAPP_SECRET
        sync: false
      - key: HYDROLAND_INTEGRATION_ESIGN_STATUS
        sync: false
      - key: HYDROLAND_ESIGN_PROVIDER
        sync: false
      - key: SIGNIT_API_KEY
        sync: false
      - key: HYDROLAND_ESIGN_DOCUMENT_HOSTS
        sync: false
      - key: HYDROLAND_INTEGRATION_TRANSLATION_ENGINE_STATUS
        sync: false
      - key: HYDROLAND_TRANSLATION_PROVIDER
        sync: false
      - key: GOOGLE_CLOUD_TRANSLATION_API_KEY
        sync: false
      - key: HYDROLAND_INTEGRATION_OBJECT_STORAGE_STATUS
        sync: false
      - key: HYDROLAND_OBJECT_STORAGE_PROVIDER
        sync: false
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: HYDROLAND_OBJECT_STORAGE_URL_TTL_SECONDS
        value: '300'
      - key: HYDROLAND_INTEGRATION_DISTRESS_AIS_STATUS
        sync: false
      - key: HYDROLAND_DISTRESS_AIS_PROVIDER
        sync: false
      - key: MARINETRAFFIC_API_KEY
        sync: false
      - key: HYDROLAND_PUBLIC_WEB_ORIGIN
        value: https://hydroland-web.onrender.com
      - key: WEB_ORIGIN
        value: https://sultanasiri001-sys.github.io
