# Separate synthetic database and service. Never attach production env groups.
databases:
  - name: hydroland-center-uat-db
    databaseName: hydroland_center_uat
    plan: free
    region: oregon
    postgresMajorVersion: '18'
    ipAllowList: []
services:
  - type: web
    name: hydroland-center-uat
    runtime: node
    plan: free
    region: oregon
    branch: feat/center-uat-sandbox-20261015
    autoDeployTrigger: 'off'
    buildCommand: node scripts/center-uat/build.mjs
    startCommand: node scripts/center-uat/serve.mjs
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HYDROLAND_UAT_ENABLED
        value: 'true'
      - key: HYDROLAND_UAT_DATABASE
        value: hydroland_center_uat
      - key: DATABASE_URL
        fromDatabase:
          name: hydroland-center-uat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: HYDROLAND_UAT_PASSWORD
        sync: false
