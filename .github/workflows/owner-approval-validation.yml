name: Owner approvals and HR source acceptance
on:
  pull_request:
    paths:
      - 'apps/api/src/document-forms/**'
      - 'apps/api/scripts/owner-administrative-approval*'
      - 'apps/api/scripts/hr-document-source*'
      - 'apps/api/scripts/hr-attendance-source*'
      - 'apps/web/src/hydroland-documents.js'
      - 'apps/web/src/hydroland-owner-approval.js'
      - 'apps/web/src/hydroland-hr-source.js'
      - 'apps/web/src/hydroland-hr-attendance.js'
      - 'apps/web/scripts/owner-administrative-approval-validation.cjs'
      - 'apps/web/scripts/hr-document-source-validation.cjs'
      - 'apps/web/scripts/hr-attendance-source-validation.cjs'
      - '.github/workflows/owner-approval-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-approval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hydroland
          POSTGRES_PASSWORD: hydroland
          POSTGRES_DB: hydroland_form_library_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hydroland -d hydroland_form_library_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hydroland:hydroland@127.0.0.1:5432/hydroland_form_library_ci
      NODE_ENV: test
      JWT_SECRET: ci-owner-approval-isolated-secret-at-least-32-characters
      PORT: 3114
      FORM_LIBRARY_E2E_CONFIRM: ISOLATED_LOOPBACK_DATABASE
      FORM_LIBRARY_E2E_BASE_URL: http://127.0.0.1:3114/api/v1/
      OWNER_APPROVAL_HTTP_BROWSER: '1'
      HR_SOURCE_HTTP_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retain exact source identity
        run: |
          mkdir -p /tmp/form-library-evidence
          git log -1 --format='%H %P %s' > /tmp/form-library-evidence/checkout.txt
          git archive --format=zip --output=/tmp/form-library-evidence/source.zip HEAD
      - run: npm ci --workspace=@hydroland/api --workspace=@hydroland/web --include-workspace-root=true
      - run: npm --workspace @hydroland/api run db:generate
      - run: npm --workspace @hydroland/api exec -- prisma db push --skip-generate
      - run: npm --workspace @hydroland/api run build
      - run: npm --workspace @hydroland/web exec -- playwright install --with-deps chromium
      - run: node apps/api/scripts/owner-administrative-approval-pdf-validation.cjs
      - name: Start isolated API
        run: |
          node apps/api/dist/main.js > /tmp/form-library-evidence/api.log 2>&1 &
          echo "$!" > /tmp/owner-approval-api.pid
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3114/api/v1/health > /dev/null; then ready=1; break; fi
            if ! kill -0 "$(cat /tmp/owner-approval-api.pid)" 2>/dev/null; then cat /tmp/form-library-evidence/api.log; exit 1; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/form-library-evidence/api.log; exit 1; fi
      - name: Real HTTP PostgreSQL recording and private receipt acceptance
        run: |
          set -o pipefail
          node apps/api/scripts/owner-administrative-approval-http-e2e.mjs 2>&1 | tee /tmp/form-library-evidence/owner-http.log
      - name: Real canonical HR source checks and shipped document editor
        run: |
          set -o pipefail
          node apps/web/scripts/hr-document-source-validation.cjs | tee /tmp/form-library-evidence/hr-source-client.log
          node apps/api/scripts/hr-document-source-http-e2e.mjs 2>&1 | tee /tmp/form-library-evidence/hr-source-http.log
      - name: Attendance and leave return source acceptance
        run: |
          set -o pipefail
          node apps/web/scripts/hr-attendance-source-validation.cjs | tee /tmp/form-library-evidence/hr-attendance-client.log
          node apps/api/scripts/hr-attendance-source-http-e2e.mjs 2>&1 | tee /tmp/form-library-evidence/hr-attendance-http.log
      - name: Stop isolated API
        if: always()
        run: |
          if [ -f /tmp/owner-approval-api.pid ]; then kill "$(cat /tmp/owner-approval-api.pid)" || true; fi
      - run: npm --workspace @hydroland/web run build
      - run: npm --workspace @hydroland/web exec -- playwright install --with-deps chromium
      - name: Actual dialog with isolated request fixtures
        run: |
          set -o pipefail
          node apps/web/scripts/owner-administrative-approval-validation.cjs | tee /tmp/form-library-evidence/owner-browser.log
      - name: Preserve isolated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-approval-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/form-library-evidence/
          retention-days: 3
          if-no-files-found: error
