name: Stage 3 Official Onboarding Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/integrations/official-onboarding-readiness.controller.ts'
      - 'apps/api/src/integrations/integration.module.ts'
      - 'apps/api/scripts/official-onboarding-readiness-validation.mjs'
      - 'apps/api/scripts/production-integration-inventory.mjs'
      - 'apps/api/scripts/stage3-integration-coverage-validation.mjs'
      - 'docs/STAGE3_INTEGRATION_COVERAGE.md'
      - 'render.yaml'
      - '.github/workflows/stage3-official-onboarding-validation.yml'
  push:
    branches: [ops/stage3-official-onboarding-boundaries]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --workspace @hydroland/api run db:generate
      - name: Validate official onboarding boundaries
        run: node apps/api/scripts/official-onboarding-readiness-validation.mjs
      - name: Validate Stage 3 integration coverage
        run: node apps/api/scripts/stage3-integration-coverage-validation.mjs
      - name: Validate existing integration safeguards
        run: node apps/api/scripts/integration-readiness-validation.mjs
      - name: API typecheck
        run: npm --workspace @hydroland/api run typecheck
      - name: API build
        run: npm --workspace @hydroland/api run build
