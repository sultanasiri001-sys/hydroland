name: Stage 2 Production One-Shot

on:
  push:
    branches: [test/stage-2-production-operational-e2e]

jobs:
  operational-journey:
    runs-on: ubuntu-latest
    environment: production-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --workspace @hydroland/api run db:generate
      - name: Preflight deployed production target
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          test -n "$E2E_BASE_URL"
          test -n "$DATABASE_URL"
          test -n "$E2E_ADMIN_EMAIL"
          test -n "$E2E_ADMIN_PASSWORD"
          case "$E2E_BASE_URL" in https://*) ;; *) echo "E2E_BASE_URL must use HTTPS"; exit 1 ;; esac
          case "$E2E_BASE_URL" in *localhost*|*127.0.0.1*) echo "E2E_BASE_URL must be deployed"; exit 1 ;; esac
          case "$E2E_ADMIN_EMAIL" in *@hydroland.test) ;; *) echo "E2E admin must use @hydroland.test"; exit 1 ;; esac
      - name: Prepare E2E admin account
        working-directory: apps/api
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: node scripts/prepare-e2e-account.mjs
      - name: Bootstrap E2E admin
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          ALLOW_E2E_BOOTSTRAP: 'true'
        run: node scripts/bootstrap-e2e-admin.mjs
      - name: Enable production weather enforcement
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.E2E_BASE_URL.replace(/\/$/, '');
          const login = await fetch(`${base}/api/v1/auth/login`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ email: process.env.E2E_ADMIN_EMAIL, password: process.env.E2E_ADMIN_PASSWORD }),
          });
          if (!login.ok) throw new Error(`Admin login failed: HTTP ${login.status}`);
          const { accessToken } = await login.json();
          const headers = { authorization: `Bearer ${accessToken}` };
          const beforeResponse = await fetch(`${base}/api/v1/trips/admin/weather-gate`, { headers });
          if (!beforeResponse.ok) throw new Error(`Read weather gate failed: HTTP ${beforeResponse.status}`);
          const before = await beforeResponse.json();
          console.log(`Weather gate before: enabled=${before.enabled}, mode=${before.mode}, provider=${before.provider}`);
          if (before.enabled !== true || before.mode !== 'ENFORCE') {
            const configure = await fetch(`${base}/api/v1/trips/admin/weather-gate`, {
              method: 'PATCH',
              headers: { ...headers, 'content-type': 'application/json' },
              body: JSON.stringify({ enabled: true, mode: 'ENFORCE' }),
            });
            if (!configure.ok) throw new Error(`Enable weather enforcement failed: HTTP ${configure.status}`);
            const updated = await configure.json();
            if (updated.enabled !== true || updated.mode !== 'ENFORCE') throw new Error('Weather enforcement did not persist.');
            console.log(`Weather gate enabled: enabled=${updated.enabled}, mode=${updated.mode}, provider=${updated.provider}`);
          } else {
            console.log('Weather gate already enforced; no configuration change required.');
          }
          NODE
      - name: Run Stage 2 production operational journey
        working-directory: apps/api
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: node scripts/production-operational-e2e.mjs
      - name: Revoke temporary E2E admin privileges
        if: always()
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          ALLOW_E2E_BOOTSTRAP: 'true'
        run: node scripts/cleanup-e2e-admin.mjs
