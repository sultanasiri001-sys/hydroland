name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # User-approved release boundary: web/API/root, including build tools.
    # Mobile and the full repository retain a separate failing security gate.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web and API release dependencies
        run: npm ci --workspace=@hydroland/api --workspace=@hydroland/web --include-workspace-root=true
      - name: Verify fail-closed audit contract
        run: node scripts/release-dependency-audit.test.mjs
      - name: Audit web/API release including build dependencies
        run: node scripts/release-dependency-audit.mjs web-api audit.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-api-dependency-audit
          path: audit.json
          retention-days: 7
