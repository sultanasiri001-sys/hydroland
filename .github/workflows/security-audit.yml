name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Generate dependency audit report and enforce severity gate
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('audit.json','utf8'));
          const vulns=report.vulnerabilities||{};
          const rows=Object.entries(vulns)
            .filter(([,v])=>['high','critical'].includes(v.severity))
            .map(([name,v])=>({name,severity:v.severity,direct:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:(v.via||[]).map(x=>typeof x==='string'?x:{source:x.source,name:x.name,title:x.title,severity:x.severity,range:x.range})}));
          console.log(JSON.stringify({metadata:report.metadata?.vulnerabilities||{},highOrCritical:rows},null,2));
          const knownExpoForge = new Set(['expo','@expo/cli','@expo/code-signing-certificates','node-forge']);
          const blocking=rows.filter(row=>!knownExpoForge.has(row.name));
          const known=rows.filter(row=>knownExpoForge.has(row.name));
          if(known.length) console.warn('Known upstream Expo/node-forge advisory chain detected; tracked separately because npm currently reports no non-breaking SDK 57 remediation.');
          if(blocking.length){
            console.error(`Security gate failed: ${blocking.length} unapproved high/critical package vulnerabilities detected.`);
            process.exit(1);
          }
          NODE
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit.json
          retention-days: 7
