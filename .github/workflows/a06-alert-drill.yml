name: A06 synthetic provider alert route
on:
  pull_request:
    paths:
      - 'scripts/a06-alert-drill*'
      - '.github/workflows/a06-alert-drill.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/a06-alert-drill*'
      - '.github/workflows/a06-alert-drill.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Synthetic issue delivery/recovery drill only; no real provider outage'
        required: true
        type: choice
        options: [A06_SYNTHETIC_ROUTE_ONLY]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/a06-alert-drill.test.mjs
  drill:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'A06_SYNTHETIC_ROUTE_ONLY'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: a06-synthetic-alert-route
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deliver and recover explicitly synthetic provider alert
        env:
          GH_TOKEN: ${{ github.token }}
          A06_CONFIRM: ${{ inputs.confirm }}
        run: |
          mkdir -p evidence
          node scripts/a06-alert-drill.mjs > evidence/a06-alert-route.json
          cat evidence/a06-alert-route.json
      - uses: actions/upload-artifact@v4
        with:
          name: a06-synthetic-alert-route
          path: evidence/a06-alert-route.json
          retention-days: 30
