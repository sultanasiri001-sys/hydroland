name: Resume source review

on:
  pull_request:
    paths:
      - '.github/workflows/resume-source-review.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          git archive --format=tar.gz -o review-source.tar.gz HEAD
          git rev-parse HEAD > review-source.sha
          sha256sum review-source.tar.gz > review-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: resume-source-review
          path: |
            review-source.tar.gz
            review-source.sha
            review-source.sha256
          retention-days: 1
          if-no-files-found: error
