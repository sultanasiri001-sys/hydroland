name: GENERAL-L1 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [build/general-l1-foundation]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hydroland
          POSTGRES_PASSWORD: hydroland
          POSTGRES_DB: hydroland_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U hydroland" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgresql://hydroland:hydroland@localhost:5432/hydroland_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:migrate --workspace=@hydroland/api
      - run: npm run db:migrate --workspace=@hydroland/api
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
