name: Persist dependency lock
on:
  push:
    branches:
      - fix/persist-dependency-lock
    paths:
      - '.github/workflows/persist-dependency-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/persist-dependency-lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Use npm 10.9.8
        run: npm install --global npm@10.9.8
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify dependency audit
        run: npm audit --audit-level=high
      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(deps): persist audited package lock"
          git push
