name: Web validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-validation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --workspace=@hydroland/web --include-workspace-root=true --ignore-scripts
      - name: Static web validation
        run: npm run test -w @hydroland/web
      - name: Production web build
        run: npm run build -w @hydroland/web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Account lifecycle and fresh action authorization regression
        run: npm run test:e2e -w @hydroland/web -- admin-account-lifecycle.spec.js admin-employee-onboarding.spec.js admin-agent-runtime.spec.js approved-portal-rebuild.spec.js booking-safety-control.spec.js center-team-review.spec.js portal-action-authorization.spec.js --output=test-results-admin-accounts
      - name: Center workflow focused regression
        run: npm run test:e2e -w @hydroland/web -- center-navigation.spec.js store-offerings.spec.js center-reports.spec.js center-training-entry.spec.js portal-selection-reload.spec.js --output=test-results-center-navigation
      - name: Organization portal focused regression
        run: npm run test:e2e -w @hydroland/web -- organization-portal.spec.js --output=test-results-organization
      - name: Professional training completion regression
        run: npm run test:e2e -w @hydroland/web -- professional-training-plan.spec.js --output=test-results-professional-training
      - name: Training certificate review regression
        run: npm run test:e2e -w @hydroland/web -- training-certificate-review.spec.js professional-portal-closure.spec.js --output=test-results-training-certificates
      - name: Booking participant review regression
        run: npm run test:e2e -w @hydroland/web -- booking-participant-review.spec.js --output=test-results-booking-review
      - name: Browser E2E
        run: npm run test:e2e -w @hydroland/web
      - name: Phase 4 notification focused regression
        # Keep the full-suite test-results directory intact for the visual-review artifact steps below.
        run: npm run test:e2e -w @hydroland/web -- safety-notifications.spec.js --output=test-results-focused
      - name: Public interface review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-interface-review
          path: |
            apps/web/test-results/**/visitor-*.png
            apps/web/test-results/**/public-*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Approved portal rebuild screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-portal-review
          path: apps/web/test-results/**/portal-*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Account and authentication review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-interface-review
          path: apps/web/test-results/**/account-*.png
          if-no-files-found: ignore
          retention-days: 7
