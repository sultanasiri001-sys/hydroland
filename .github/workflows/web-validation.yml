name: Web validation

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-validation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run test -w @hydroland/web
      - run: npm run build -w @hydroland/web
