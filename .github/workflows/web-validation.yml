name: Web validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-validation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Static web validation
        run: npm run test -w @hydroland/web
      - name: Production web build
        run: npm run build -w @hydroland/web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e -w @hydroland/web
      - name: Public interface review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-interface-review
          path: |
            apps/web/test-results/**/visitor-*.png
            apps/web/test-results/**/public-*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Approved portal rebuild screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-portal-review
          path: apps/web/test-results/**/portal-*.png
          if-no-files-found: ignore
          retention-days: 3
