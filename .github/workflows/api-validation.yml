name: API validation
on:
  pull_request:
  push:
    branches: [main, feat/database-foundation, consolidation/hydroland-unified, feat/operations-l1-l4]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hydroland
          POSTGRES_PASSWORD: hydroland
          POSTGRES_DB: hydroland
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hydroland -d hydroland"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://hydroland:hydroland@localhost:5432/hydroland
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --workspace=@hydroland/api --workspace=@hydroland/web --include-workspace-root=true
      - run: npm --workspace @hydroland/api run db:generate
      # Legacy migration history contains pre-production migrations whose original SQL
      # cannot bootstrap a clean database (for example TEXT -> UUID FK drift).
      # Historical files are immutable and production already has repaired/applied state.
      # CI therefore validates the canonical Prisma schema on an ephemeral clean database,
      # then restores raw-SQL operational extensions from their production migration definitions.
      # Forward migration immutability is enforced separately by Production Release Gate.
      - name: Bootstrap canonical schema on clean PostgreSQL
        run: npm --workspace @hydroland/api exec -- prisma db push --skip-generate
      - name: Center license forward migration on TEXT and UUID asset keys
        run: node apps/api/scripts/center-license-migration-db-e2e.mjs
      - name: Center license platform-review forward migration
        run: node apps/api/scripts/center-license-platform-review-migration-checks.mjs
      - name: AI runtime forward migration on TEXT and UUID account keys
        run: node apps/api/scripts/agent-runtime-migration-db-e2e.mjs
      - name: Unified store forward migration on TEXT and UUID organization keys
        run: node apps/api/scripts/store-offerings-migration-db-e2e.mjs
      - name: Organization booking forward migrations on TEXT and UUID keys
        run: node apps/api/scripts/organization-booking-migration-db-checks.mjs
      - name: Bootstrap raw equipment operational schema
        run: node apps/api/scripts/bootstrap-equipment-runtime-schema.mjs
      - name: Bootstrap trip weather operational schema
        run: node apps/api/scripts/bootstrap-trip-weather-runtime-schema.mjs
      - name: Bootstrap messaging runtime schema
        run: node apps/api/scripts/bootstrap-messaging-runtime-schema.mjs
      - run: npm run validate:hr -w @hydroland/api
      - run: npm run validate:operations -w @hydroland/api
      - run: npm run validate:admin-affairs -w @hydroland/api
      - run: npm run validate:finance -w @hydroland/api
      - run: npm run validate:inventory -w @hydroland/api
      - run: npm run validate:customer-service -w @hydroland/api
      - run: npm run validate:organization-invitations -w @hydroland/api
      - run: npm run validate:organization-customer-cases -w @hydroland/api
      - run: npm run validate:marketing -w @hydroland/api
      - run: npm run validate:safety -w @hydroland/api
      - run: npm run validate:technology-security -w @hydroland/api
      - run: npm run validate:facilities-maintenance -w @hydroland/api
      - run: npm run validate:legal-governance -w @hydroland/api
      - run: npm run validate:executive-governance -w @hydroland/api
      - run: npm run validate:research-market -w @hydroland/api
      - run: npm run validate:document-forms -w @hydroland/api
      - run: npm run validate:document-template-catalog -w @hydroland/api
      - run: npm run validate:operational-document-catalog -w @hydroland/api
      - run: npm run validate:document-lifecycle -w @hydroland/api
      - run: npm run validate:document-persistence -w @hydroland/api
      - run: npm run validate:document-persistence-api -w @hydroland/api
      - run: npm run validate:document-reference-numbering -w @hydroland/api
      - run: npm run validate:operational-document-template-seed -w @hydroland/api
      - run: npm run validate:document-rbac -w @hydroland/api
      - run: npm run validate:document-pdf-arabic -w @hydroland/api
      - run: npm run validate:auth-session -w @hydroland/api
      - run: npm run validate:protected-routes-rbac -w @hydroland/api
      - name: Validate messaging runtime boundaries
        run: node apps/api/scripts/messaging-validation.mjs
      - run: npm run validate:phase10 -w @hydroland/api
      - run: npm run validate:phase12 -w @hydroland/api
      - run: npm run validate:training -w @hydroland/api
      - run: npm run validate:wallet-rewards -w @hydroland/api
      - run: npm run validate:trip-intelligence -w @hydroland/api
      - run: npm run validate:translation -w @hydroland/api
      - run: npm run validate:marine -w @hydroland/api
      - run: npm run validate:integrations -w @hydroland/api
      - run: npm run typecheck --workspace=@hydroland/api
      - run: npm run build --workspace=@hydroland/api
      - name: Read-only model connection diagnostics without generation
        run: node apps/api/scripts/agent-provider-connection-check.mjs
      - name: Build connected browser fixture
        run: npm run build -w @hydroland/web
      - name: Install connected browser Chromium
        # Ubuntu's runner already provides the native browser libraries. The
        # connected fixture launches Chromium and verifies those dependencies.
        # Avoid unrelated OS/font upgrades in the API validation job.
        run: npx playwright install --only-shell chromium
      - name: Durable AI queue and controls HTTP and PostgreSQL
        env:
          NODE_ENV: test
          JWT_SECRET: ci-ai-runtime-secret-at-least-32-characters
          PORT: 3110
          HYDROLAND_AI_TEST_MANUAL_WORKER: '1'
          AI_E2E_BROWSER: '1'
          HYDROLAND_INTEGRATION_AI_MODEL_STATUS: SANDBOX
          HYDROLAND_AI_PROVIDER: OPENAI
          OPENAI_API_KEY: ci-ai-runtime-not-a-real-key
          HYDROLAND_AI_MODEL: fixture-model
          HYDROLAND_AI_INPUT_MICRO_USD_PER_MILLION: '1000000'
          HYDROLAND_AI_OUTPUT_MICRO_USD_PER_MILLION: '1000000'
          HYDROLAND_AI_DAILY_BUDGET_MICRO_USD: '1000000'
          HYDROLAND_AI_TEST_BASE_URL: http://127.0.0.1:3321/v1
        run: |
          node apps/api/dist/main.js > /tmp/hydroland-ai-runtime-api.log 2>&1 &
          AI_RUNTIME_API_PID=$!
          trap 'AI_RUNTIME_EXIT=$?; kill $AI_RUNTIME_API_PID || true; if [ "$AI_RUNTIME_EXIT" -ne 0 ]; then cat /tmp/hydroland-ai-runtime-api.log; fi' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3110/api/v1/health/ready > /dev/null; then break; fi
            sleep 1
          done
          node apps/api/scripts/agent-runtime-http-e2e.mjs
      - name: Staff provisioning and scoped IAM HTTP and PostgreSQL
        env:
          NODE_ENV: test
          JWT_SECRET: ci-staffing-lifecycle-secret-at-least-32-characters
          PORT: 3103
          GOOGLE_CLIENT_ID: ci-staffing.apps.googleusercontent.com
          HYDROLAND_INTEGRATION_EMAIL_STATUS: SANDBOX
          HYDROLAND_EMAIL_PROVIDER: RESEND
          HYDROLAND_EMAIL_FROM: HYDROLAND <test@example.invalid>
          HYDROLAND_EMAIL_TEST_RECIPIENT: staff-ci-${{ github.run_id }}-${{ github.run_attempt }}@example.invalid
          HYDROLAND_PUBLIC_WEB_ORIGIN: http://127.0.0.1:4173
          RESEND_API_KEY: ci-staffing-not-a-real-key
          RESEND_API_BASE_URL: http://127.0.0.1:3317
        run: |
          node apps/api/dist/main.js > /tmp/hydroland-staffing-api.log 2>&1 &
          STAFFING_API_PID=$!
          trap 'STAFFING_EXIT=$?; kill $STAFFING_API_PID || true; if [ "$STAFFING_EXIT" -ne 0 ]; then cat /tmp/hydroland-staffing-api.log; fi' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3103/api/v1/health/ready > /dev/null; then break; fi
            sleep 1
          done
          node apps/api/scripts/staffing-admin-http-e2e.mjs
          node apps/api/scripts/hr-control-review-http-e2e.mjs
      - name: Admin account lifecycle HTTP and PostgreSQL
        env:
          NODE_ENV: test
          JWT_SECRET: ci-account-lifecycle-secret-at-least-32-characters
          PORT: 3102
        run: |
          node apps/api/dist/main.js > /tmp/hydroland-accounts-api.log 2>&1 &
          ACCOUNTS_API_PID=$!
          trap 'ACCOUNTS_EXIT=$?; kill $ACCOUNTS_API_PID || true; if [ "$ACCOUNTS_EXIT" -ne 0 ]; then cat /tmp/hydroland-accounts-api.log; fi' EXIT
          ACCOUNTS_READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3102/api/v1/health >/dev/null; then ACCOUNTS_READY=1; break; fi
            if ! kill -0 $ACCOUNTS_API_PID 2>/dev/null; then cat /tmp/hydroland-accounts-api.log; exit 1; fi
            sleep 1
          done
          if [ "$ACCOUNTS_READY" -ne 1 ]; then cat /tmp/hydroland-accounts-api.log; exit 1; fi
          ACCOUNTS_E2E_BASE_URL=http://127.0.0.1:3102/api/v1 node apps/api/scripts/admin-account-lifecycle-http-e2e.mjs
      - name: Booking safety policy enforcement and audit
        run: node apps/api/scripts/booking-safety-policy-validation.cjs && node apps/api/scripts/operational-controls-validation.cjs
      - name: Service images TEXT/UUID persistence and access regression
        env:
          NODE_ENV: test
        run: node apps/api/scripts/service-images-schema-db-e2e.mjs
      - name: Booking search TEXT/UUID production schema regression
        env:
          NODE_ENV: test
        run: node apps/api/scripts/booking-search-schema-db-e2e.mjs
      - name: Finance shifts and receivables center isolation TEXT/UUID matrix
        env:
          NODE_ENV: test
        run: node apps/api/scripts/finance-shifts-schema-db-e2e.mjs
      - name: Credential upload payload and legacy schema regression
        run: node apps/api/scripts/credential-upload-regression.mjs
      - name: Credential storage configuration and readiness
        run: node apps/api/scripts/credential-storage-readiness-validation.mjs
      - name: Auth email outbox PostgreSQL E2E
        run: node apps/api/scripts/auth-email-outbox-db-e2e.mjs
      - name: MFA lifecycle PostgreSQL E2E
        run: node apps/api/scripts/mfa-lifecycle-db-e2e.mjs
      - name: Credential integrity PostgreSQL E2E
        run: node apps/api/scripts/credential-integrity-db-e2e.mjs
      - name: Diver profile production-schema PostgreSQL E2E
        run: node apps/api/scripts/diver-profile-schema-db-e2e.mjs
      - name: HR HTTP/DB E2E
        env:
          JWT_SECRET: ci-hr-e2e-secret-must-be-at-least-32-characters
          PORT: 3101
          HYDROLAND_INTEGRATION_OBJECT_STORAGE_STATUS: SANDBOX
          HYDROLAND_OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:3199
          HYDROLAND_OBJECT_STORAGE_REGION: us-east-1
          HYDROLAND_OBJECT_STORAGE_BUCKET: hydroland-e2e
          HYDROLAND_OBJECT_STORAGE_ACCESS_KEY_ID: hydroland-e2e-access
          HYDROLAND_OBJECT_STORAGE_SECRET_ACCESS_KEY: hydroland-e2e-secret
          HYDROLAND_INTEGRATION_WEATHER_MARINE_STATUS: SANDBOX
          STORMGLASS_API_KEY: hydroland-e2e-weather
          STORMGLASS_API_BASE_URL: http://127.0.0.1:3198
          HYDROLAND_INTEGRATION_MAPS_GEO_STATUS: SANDBOX
          HYDROLAND_MAP_PROVIDER: E2E_MAPS
          HYDROLAND_MAP_STYLE_URL: https://maps.hydroland.test/style.json
          HYDROLAND_INTEGRATION_PAYMENT_PSP_STATUS: SANDBOX
          HYDROLAND_PAYMENT_PROVIDER: MOYASAR
          MOYASAR_SECRET_KEY: sk_test_hydroland_e2e
          MOYASAR_WEBHOOK_SECRET: whsec-hydroland-e2e
          MOYASAR_API_BASE_URL: http://127.0.0.1:3197/v1/
          HYDROLAND_PUBLIC_WEB_ORIGIN: http://127.0.0.1:4173
        run: |
          node apps/api/dist/main.js > /tmp/hydroland-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3101/api/v1/health >/dev/null; then READY=1; break; fi
            if ! kill -0 $API_PID 2>/dev/null; then
              echo "API process exited before becoming healthy"
              cat /tmp/hydroland-api.log
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "API did not become healthy within 30 seconds"
            cat /tmp/hydroland-api.log
            exit 1
          fi
          HR_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/hr-http-e2e.mjs
          ADMIN_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/administrative-affairs-http-e2e.mjs
          RBAC_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/runtime-rbac-ownership-http-e2e.mjs
          FINANCE_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/finance-http-e2e.mjs
          MAPS_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/maps-runtime-http-e2e.mjs
          MESSAGING_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/messaging-http-e2e.mjs
          NOTIFICATIONS_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/notifications-http-e2e.mjs
          STORE_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/store-checkout-http-e2e.mjs
          STORE_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/store-offerings-http-e2e.mjs
          CONTROLS_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/operational-controls-http-e2e.mjs
          node --test apps/api/scripts/moyasar-webhook-validation.cjs
          PAYMENT_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/payment-moyasar-http-e2e.mjs
          MARINE_DOCS_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/marine-documents-http-e2e.mjs
          MARINE_READINESS_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/marine-readiness-http-e2e.mjs
          MARINE_TRIPS_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/marine-trip-management-http-checks.mjs
          ORGANIZATION_BOOKING_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/organization-booking-http-checks.mjs
          SAFETY_CHECKLIST_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/safety-checklist-http-e2e.mjs
          CENTER_SAFETY_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/center-safety-http-e2e.mjs
          SAFETY_INCIDENTS_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/safety-incidents-http-e2e.mjs
          if ! PROFILE_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/profile-account-http-e2e.mjs; then
            echo "Profile/Account HTTP/DB E2E failed; API log follows"
            cat /tmp/hydroland-api.log
            exit 1
          fi
          if ! EQUIPMENT_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/equipment-runtime-http-e2e.mjs; then
            echo "Equipment HTTP/DB E2E failed; API log follows"
            cat /tmp/hydroland-api.log
            exit 1
          fi
          if ! BOOKING_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/booking-runtime-http-e2e.mjs; then
            echo "Booking HTTP/DB E2E failed; API log follows"
            cat /tmp/hydroland-api.log
            exit 1
          fi
          if ! CREDENTIAL_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/credential-documents-http-e2e.mjs; then
            echo "Credential Documents HTTP/DB E2E failed; API log follows"
            cat /tmp/hydroland-api.log
            exit 1
          fi
          if ! DOCUMENT_LIST_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/document-list-http-e2e.mjs; then
            echo "Organization Document List HTTP/DB E2E failed; API log follows"
            cat /tmp/hydroland-api.log
            exit 1
          fi
          PHASE5_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/phase5-centers-approvals-http-e2e.mjs
          PHASE5_ROLE_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/phase5-role-approval-http-e2e.mjs
          if ! DOCUMENT_E2E_BASE_URL=http://127.0.0.1:3101/api/v1 node apps/api/scripts/document-http-db-e2e.mjs; then
            echo "Document HTTP/DB E2E failed; API log follows"
            cat /tmp/hydroland-api.log
            exit 1
          fi

      - name: Phase 4 append-only audit database boundary
        run: node apps/api/scripts/audit-append-only-validation.mjs

