name: API validation
on:
  pull_request:
  push:
    branches: [main, feat/database-foundation, feat/live-trip-operations]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://hydroland:hydroland@localhost:5432/hydroland
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --workspace @hydroland/api run db:generate
      - run: npm run validate:phase10 -w @hydroland/api
      - run: npm run validate:phase12 -w @hydroland/api
      - run: npm run validate:compliance-hardening -w @hydroland/api
      - run: npm run validate:center-runtime-access -w @hydroland/api
      - run: npm run typecheck
      - run: npm run build
