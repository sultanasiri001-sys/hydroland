name: Production E2E

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: production-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Preflight production E2E target
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          test -n "$E2E_BASE_URL"
          test -n "$DATABASE_URL"
          test -n "$E2E_ADMIN_EMAIL"
          test -n "$E2E_ADMIN_PASSWORD"
          case "$E2E_BASE_URL" in https://*) ;; *) echo "E2E_BASE_URL must use HTTPS"; exit 1 ;; esac
          case "$E2E_BASE_URL" in *localhost*|*127.0.0.1*) echo "E2E_BASE_URL must be a deployed target"; exit 1 ;; esac
          case "$E2E_ADMIN_EMAIL" in *@hydroland.test) ;; *) echo "E2E account must use @hydroland.test"; exit 1 ;; esac
      - run: npm --workspace @hydroland/api run db:generate
      - name: Prepare E2E account through API
        working-directory: apps/api
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: node scripts/prepare-e2e-account.mjs
      - name: Bootstrap E2E admin
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          ALLOW_E2E_BOOTSTRAP: 'true'
        run: node scripts/bootstrap-e2e-admin.mjs
      - name: Run production smoke tests
        working-directory: apps/api
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: node scripts/production-smoke.mjs
      - name: Run isolated production operational journey E2E
        working-directory: apps/api
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: node scripts/production-operational-e2e.mjs
      - name: Run isolated production finance E2E
        working-directory: apps/api
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: node scripts/finance-production-e2e.mjs
      - name: Revoke temporary E2E admin privileges
        if: always()
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          ALLOW_E2E_BOOTSTRAP: 'true'
        run: node scripts/cleanup-e2e-admin.mjs
