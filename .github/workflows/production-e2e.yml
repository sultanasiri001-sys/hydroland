name: Production E2E

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: production-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm --workspace @hydroland/api run db:generate
      - name: Guard required configuration
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          test -n "$E2E_BASE_URL"
          test -n "$DATABASE_URL"
          test -n "$E2E_ADMIN_EMAIL"
          test -n "$E2E_ADMIN_PASSWORD"
          case "$E2E_BASE_URL" in https://*) ;; *) exit 1 ;; esac
          case "$E2E_ADMIN_EMAIL" in *@hydroland.test) ;; *) exit 1 ;; esac
      - name: Bootstrap E2E admin
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          ALLOW_E2E_BOOTSTRAP: 'true'
        run: node scripts/bootstrap-e2e-admin.mjs
      - name: Run production smoke tests
        working-directory: apps/api
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: node scripts/production-smoke.mjs
