name: Stage 3 R2 Object Storage Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/trip-intelligence/offline-payload-storage.service.ts'
      - 'apps/api/scripts/r2-object-storage-validation.mjs'
      - 'package.json'
      - 'render.yaml'
  push:
    branches: [feat/stage3-r2-object-storage]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --workspace @hydroland/api run db:generate
      - name: Validate private R2 delivery contract
        working-directory: apps/api
        run: node scripts/r2-object-storage-validation.mjs
      - name: Validate Trip Intelligence safeguards
        run: npm --workspace @hydroland/api run validate:trip-intelligence
      - name: API typecheck
        run: npm --workspace @hydroland/api run typecheck
      - name: API build
        run: npm --workspace @hydroland/api run build
