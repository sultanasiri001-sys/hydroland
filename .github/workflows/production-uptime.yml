name: Production Uptime Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  uptime:
    name: Verify public services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check API liveness
        run: |
          response="$(curl --fail --silent --show-error --max-time 20 https://hydroland.onrender.com/api/v1/health)"
          echo "$response" | jq -e '.service == "hydroland-api" and .status == "ok"'
      - name: Check API readiness
        run: |
          response="$(curl --fail --silent --show-error --max-time 20 https://hydroland.onrender.com/api/v1/health/ready)"
          echo "$response" | jq -e '.service == "hydroland-api" and .status == "ready" and .database == "ok"'
      - name: Check web shell
        run: |
          curl --fail --silent --show-error --max-time 20 https://hydroland-web.onrender.com/ | grep -q '<title>HYDROLAND'
