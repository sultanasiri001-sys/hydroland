name: Production Uptime Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/production-uptime.yml'
      - 'apps/api/src/health/**'
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  issues: write

jobs:
  uptime:
    name: Verify public services
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check deployed API readiness
        run: |
          set -euo pipefail
          last_response=""
          for attempt in $(seq 1 120); do
            if response="$(curl --fail --silent --show-error --max-time 20 https://hydroland.onrender.com/api/v1/health/ready 2>/dev/null)"; then
              last_response="$response"
              if echo "$response" | jq -e '.service == "hydroland-api" and .status == "ready" and .database == "ok"' >/dev/null; then
                echo "$response" | jq .
                exit 0
              fi
            fi
            echo "API not ready (attempt $attempt/120)."
            sleep 10
          done
          echo "API readiness verification failed. Last response: $last_response" >&2
          exit 1

      - name: Check API liveness
        run: |
          response="$(curl --fail --silent --show-error --max-time 20 https://hydroland.onrender.com/api/v1/health)"
          echo "$response" | jq -e '.service == "hydroland-api" and .status == "ok"'

      - name: Verify payment readiness is admin-protected
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 20 --output "$body_file" --write-out '%{http_code}' https://hydroland.onrender.com/api/v1/health/integrations/payment)"
          if [ "$status" != "401" ]; then
            echo "Expected protected payment readiness endpoint to return 401 without authentication; got $status." >&2
            cat "$body_file" >&2
            exit 1
          fi
          echo "Payment readiness diagnostics are correctly protected from unauthenticated access."

      - name: Check web shell
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 20 https://hydroland-web.onrender.com/ | grep -q '<title>HYDROLAND'; then
              exit 0
            fi
            echo "Web shell not ready yet (attempt $attempt/12)."
            sleep 10
          done
          exit 1

      - name: Create or update production outage alert
        if: ${{ failure() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label='production-uptime'
          gh label create "$label" --color B60205 --description 'Automated production uptime alert' --force
          issue="$(gh issue list --state open --label "$label" --json number --jq '.[0].number // empty')"
          body="Production uptime verification failed. Workflow run: $RUN_URL\n\nAutomated check time (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title 'Production uptime incident' --label "$label" --body "$body"
          fi

      - name: Close resolved production outage alert
        if: ${{ success() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue="$(gh issue list --state open --label 'production-uptime' --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Production uptime checks recovered successfully. Workflow run: $RUN_URL"
            gh issue close "$issue" --reason completed
          fi
