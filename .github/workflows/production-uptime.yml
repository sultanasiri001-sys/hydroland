name: Production Uptime Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  uptime:
    name: Verify public services
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check deployed API readiness
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          last_response=""
          for attempt in $(seq 1 36); do
            if response="$(curl --fail --silent --show-error --max-time 20 https://hydroland.onrender.com/api/v1/health/ready 2>/dev/null)"; then
              last_response="$response"
              if echo "$response" | jq -e '.service == "hydroland-api" and .status == "ready" and .database == "ok"' >/dev/null; then
                if [ "$EVENT_NAME" != "push" ] || [ "$(echo "$response" | jq -r '.commit // empty')" = "$EXPECTED_COMMIT" ]; then
                  echo "$response" | jq .
                  exit 0
                fi
              fi
            fi
            echo "API not yet ready on expected deployment (attempt $attempt/36)."
            sleep 10
          done
          echo "API readiness/deployment verification failed. Last response: $last_response" >&2
          exit 1
      - name: Check API liveness
        run: |
          response="$(curl --fail --silent --show-error --max-time 20 https://hydroland.onrender.com/api/v1/health)"
          echo "$response" | jq -e '.service == "hydroland-api" and .status == "ok"'
      - name: Report payment integration readiness
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 20 https://hydroland.onrender.com/api/v1/health/integrations/payment)"
          echo "$response" | jq -e '
            .service == "hydroland-api" and
            .integration == "PAYMENT_PSP" and
            (.locallyConfigured | type) == "boolean" and
            (.productionReady | type) == "boolean" and
            (.sandboxReady | type) == "boolean" and
            (.checks.lifecycleOperational | type) == "boolean" and
            (.checks.providerConfigured | type) == "boolean" and
            (.checks.credentialsConfigured | type) == "boolean" and
            (.checks.webhookConfigured | type) == "boolean" and
            (.checks.publicWebOriginConfigured | type) == "boolean"
          ' >/dev/null
          echo "Payment integration readiness (sanitized):"
          echo "$response" | jq '{status,provider,locallyConfigured,productionReady,sandboxReady,checks,commit}'
      - name: Check web shell
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 20 https://hydroland-web.onrender.com/ | grep -q '<title>HYDROLAND'; then
              exit 0
            fi
            echo "Web shell not ready yet (attempt $attempt/12)."
            sleep 10
          done
          exit 1
