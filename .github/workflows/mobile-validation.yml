name: Mobile validation
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-validation.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --workspace=@hydroland/mobile --include-workspace-root=false
      - name: Validate native identities and release configuration
        run: node --test apps/mobile/scripts/native-config.test.mjs apps/mobile/scripts/native-signature.test.mjs apps/mobile/scripts/native-ios-simulator.test.mjs
      - run: npm --workspace @hydroland/mobile run test
      - run: npm --workspace @hydroland/mobile run typecheck
      - run: npm --workspace @hydroland/mobile run build

  android-native:
    needs: mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      HYDROLAND_BUILD_PROFILE: acceptance
      HYDROLAND_IOS_BUNDLE_ID: com.hydroland.acceptance
      HYDROLAND_ANDROID_PACKAGE: com.hydroland.acceptance
      HYDROLAND_BUILD_NUMBER: ${{ github.run_number }}
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:3001/api/v1
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --ignore-scripts
      - name: Generate isolated native Android project
        run: node apps/mobile/scripts/native-acceptance.mjs prepare android
      - name: Compile APK and AAB and verify identity and test signature
        id: android_build
        run: node apps/mobile/scripts/native-acceptance.mjs build android
      - name: Install verified Maestro distribution
        run: bash apps/mobile/scripts/install-maestro.sh
      - name: Enable virtual-device acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise the actual Android application
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            node apps/mobile/scripts/native-acceptance.mjs install android
            bash apps/mobile/scripts/run-native-ui.sh android
      - name: Retain native Android screenshots and source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-acceptance-evidence
          path: |
            apps/mobile/native-artifacts/android/*.json
            apps/mobile/native-artifacts/android/*.xml
            apps/mobile/native-artifacts/android/*.txt
            apps/mobile/native-artifacts/android/*.png
            apps/mobile/native-artifacts/android/maestro/**
          if-no-files-found: error
          retention-days: 14
      - name: Retain compiled Android acceptance packages
        if: always() && steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-android-packages
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  ios-native:
    needs: mobile
    # Expo SDK 57 requires Xcode 26.4+; the macOS 26 image includes 26.6.
    # https://docs.expo.dev/versions/v57.0.0/#support-for-android-and-ios-versions
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      HYDROLAND_BUILD_PROFILE: acceptance
      HYDROLAND_IOS_BUNDLE_ID: com.hydroland.acceptance
      HYDROLAND_ANDROID_PACKAGE: com.hydroland.acceptance
      HYDROLAND_BUILD_NUMBER: ${{ github.run_number }}
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:3001/api/v1
      MAESTRO_CLI_NO_ANALYTICS: '1'
      # Milliseconds for cold XCTest driver startup only; flow assertions remain mandatory.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --ignore-scripts
      - name: Verify Xcode and Swift toolchain required by Expo native modules
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version
      - name: Generate isolated native iOS project
        run: node apps/mobile/scripts/native-acceptance.mjs prepare ios
      - name: Compile the actual iOS simulator application
        id: ios_build
        run: node apps/mobile/scripts/native-acceptance.mjs build ios
      - name: Install verified Maestro distribution
        run: bash apps/mobile/scripts/install-maestro.sh
      - name: Install native application on an available iPhone simulator
        run: node apps/mobile/scripts/native-acceptance.mjs install ios
      - name: Exercise native UI, seven product journeys and encrypted storage
        run: bash apps/mobile/scripts/run-native-ui.sh ios
      - name: Retain native iOS screenshots and source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-acceptance-evidence
          path: |
            apps/mobile/native-artifacts/ios/*.json
            apps/mobile/native-artifacts/ios/*.xml
            apps/mobile/native-artifacts/ios/*.der
            apps/mobile/native-artifacts/ios/*.txt
            apps/mobile/native-artifacts/ios/*.png
            apps/mobile/native-artifacts/ios/maestro/**
          if-no-files-found: error
          retention-days: 14
      - name: Retain compiled iOS simulator application
        if: always() && steps.ios_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-simulator-application
          path: apps/mobile/native-artifacts/ios/*.tar.gz
          if-no-files-found: error
          retention-days: 14
