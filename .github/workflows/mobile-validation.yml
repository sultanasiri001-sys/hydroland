name: Mobile validation
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-validation.yml'
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose npm lock resolution
        run: |
          pwd
          ls -l "$GITHUB_WORKSPACE/package-lock.json"
          node -e "const lock=require('./package-lock.json'); console.log(JSON.stringify({lockfileVersion: lock.lockfileVersion, root: lock.packages['']?.name}))"
          npm config get package-lock
          npm config get prefix
      - run: npm ci --prefix "$GITHUB_WORKSPACE" --workspace=@hydroland/mobile --include-workspace-root=false
      - name: Print npm install diagnostics on failure
        if: failure()
        run: |
          latest_log="$(ls -t ~/.npm/_logs/*debug-0.log | head -n 1)"
          echo "npm debug log: $latest_log"
          tail -n 200 "$latest_log"
      - run: npm --prefix "$GITHUB_WORKSPACE" --workspace @hydroland/mobile run test
      - run: npm --prefix "$GITHUB_WORKSPACE" --workspace @hydroland/mobile run typecheck
      - run: npm --prefix "$GITHUB_WORKSPACE" --workspace @hydroland/mobile run build
