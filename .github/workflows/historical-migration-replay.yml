name: Historical migration replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/api/prisma/**'
      - 'apps/api/scripts/historical-migration-replay.mjs'
      - 'apps/api/scripts/historical-migration-replay.test.mjs'
      - '.github/workflows/historical-migration-replay.yml'
      - 'docs/PRODUCTION_RECOVERY_RUNBOOK.md'
  push:
    branches: [main]
    paths:
      - 'apps/api/prisma/**'
      - 'apps/api/scripts/historical-migration-replay.mjs'
      - 'apps/api/scripts/historical-migration-replay.test.mjs'
      - '.github/workflows/historical-migration-replay.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hydroland
          POSTGRES_PASSWORD: hydroland
          POSTGRES_DB: hydroland_history_replay
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U hydroland -d hydroland_history_replay"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      NODE_ENV: test
      HISTORICAL_REPLAY_CONFIRM: EMPTY_CI_DATABASE_ONLY
      DATABASE_URL: postgresql://hydroland:hydroland@127.0.0.1:5432/hydroland_history_replay?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked API tools
        run: npm ci --workspace=@hydroland/api --include-workspace-root=true --ignore-scripts
      - name: Verify production migration checksums and generate ORM
        run: |
          node apps/api/scripts/production-migration-baseline-validation.mjs
          npm run db:generate --workspace=@hydroland/api
          node apps/api/scripts/historical-migration-replay.test.mjs
      - name: Replay unchanged history on the empty database
        run: node apps/api/scripts/historical-migration-replay.mjs
      - name: Retain replay evidence even on migration failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-migration-replay-${{ github.run_id }}
          path: historical-replay-evidence/*.json
          retention-days: 30
          if-no-files-found: error
