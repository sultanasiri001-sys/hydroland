name: Privacy grievance acceptance
on:
  pull_request:
    paths:
      - 'apps/api/src/customer-service/**'
      - 'apps/api/prisma/**'
      - 'apps/api/scripts/privacy-grievance-http-checks.mjs'
      - 'apps/web/src/hydroland-privacy-grievances.js'
      - '.github/workflows/privacy-grievance.yml'
  workflow_dispatch:
jobs:
  grievance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hydroland
          POSTGRES_PASSWORD: hydroland
          POSTGRES_DB: grievance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hydroland" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hydroland:hydroland@localhost:5432/grievance_test
      PRIVACY_GRIEVANCE_E2E_BASE_URL: http://127.0.0.1:3175/api/v1
      NODE_ENV: test
      PORT: 3175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --workspace=@hydroland/api --include-workspace-root=true
      - run: npm run db:generate -w @hydroland/api && npm run build -w @hydroland/api
      - run: npm --workspace @hydroland/api exec -- prisma db push --skip-generate
      - name: Exercise forward migration and real authenticated workflow
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP TABLE "PrivacyGrievance"' -f apps/api/prisma/migrations/20261120214500_privacy_grievance/migration.sql
          node apps/api/scripts/bootstrap-messaging-runtime-schema.mjs
          export JWT_SECRET="$(openssl rand -hex 36)"
          node apps/api/dist/main.js > "$RUNNER_TEMP/grievance-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 35 --retry-connrefused --retry-delay 1 "$PRIVACY_GRIEVANCE_E2E_BASE_URL/health"
          node apps/api/scripts/privacy-grievance-http-checks.mjs
