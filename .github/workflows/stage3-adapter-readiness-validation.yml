name: Stage 3 Adapter Readiness Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/health/**'
      - 'apps/api/src/admin/admin.guard.ts'
      - 'apps/api/src/auth/access-token.guard.ts'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/scripts/production-integration-inventory.mjs'
      - 'apps/api/scripts/adapter-readiness-validation.mjs'
      - 'apps/api/scripts/integration-readiness-validation.mjs'
      - '.github/workflows/stage3-adapter-readiness-validation.yml'
  push:
    branches: [ops/stage3-adapter-readiness]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --workspace @hydroland/api run db:generate
      - name: Validate guarded adapter readiness
        run: node apps/api/scripts/adapter-readiness-validation.mjs
      - name: Validate Stage 3 integration safeguards
        run: node apps/api/scripts/integration-readiness-validation.mjs
      - name: API typecheck
        run: npm --workspace @hydroland/api run typecheck
      - name: API build
        run: npm --workspace @hydroland/api run build
