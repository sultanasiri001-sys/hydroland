name: Commerce payment boundaries
on:
  pull_request:
    paths:
      - 'apps/api/src/store/**'
      - 'apps/api/src/audit/**'
      - 'apps/api/src/database/**'
      - 'apps/api/src/auth/**'
      - 'apps/api/src/admin/admin.guard.ts'
      - 'apps/api/src/governance/training-operational-policy.ts'
      - 'apps/api/scripts/store-payment-boundary-*.cjs'
      - 'apps/api/prisma/schema.prisma'
      - 'apps/api/package.json'
      - 'package-lock.json'
      - '.github/workflows/commerce-payment-boundaries.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hydroland
          POSTGRES_PASSWORD: hydroland
          POSTGRES_DB: commerce_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U hydroland -d commerce_test_ci'
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://hydroland:hydroland@127.0.0.1:5432/commerce_test_ci
      COMMERCE_DB_TEST_CONFIRM: DISPOSABLE_LOOPBACK_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --workspace=@hydroland/api --include-workspace-root=true
      - run: npm run db:generate --workspace=@hydroland/api
      - run: npm run validate:store-payment-boundaries --workspace=@hydroland/api
      - run: npm run typecheck --workspace=@hydroland/api
      - run: npm run build --workspace=@hydroland/api
      # Fresh disposable CI DB only; not migration/deployment acceptance.
      - run: npm --workspace @hydroland/api exec -- prisma db push --skip-generate
      - run: node apps/api/scripts/store-payment-boundary-db-checks.cjs
