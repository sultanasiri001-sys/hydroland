name: Stage 3 E-Sign Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/integrations/signit-esign.service.ts'
      - 'apps/api/src/integrations/integration.module.ts'
      - 'apps/api/scripts/signit-esign-validation.mjs'
      - 'render.yaml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --workspace @hydroland/api run db:generate
      - name: Validate Signit e-sign contract
        working-directory: apps/api
        run: node scripts/signit-esign-validation.mjs
      - name: Typecheck API
        run: npm --workspace @hydroland/api run typecheck
      - name: Build API
        run: npm --workspace @hydroland/api run build
