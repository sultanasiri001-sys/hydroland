name: Stage 3 Integration Coverage Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/app.module.ts'
      - 'apps/api/src/health/**'
      - 'apps/api/src/admin/admin.guard.ts'
      - 'apps/api/src/auth/access-token.guard.ts'
      - 'apps/api/src/integrations/**'
      - 'apps/api/src/payments/**'
      - 'apps/api/src/credentials/**'
      - 'apps/api/src/trips/stormglass-weather.service.ts'
      - 'apps/api/src/trip-intelligence/offline-payload-storage.service.ts'
      - 'apps/api/src/translation/**'
      - 'apps/web/src/hydroland-map.js'
      - 'apps/api/scripts/production-integration-inventory.mjs'
      - 'apps/api/scripts/stage3-integration-coverage-validation.mjs'
      - 'apps/api/scripts/stage3-readiness-payload-contract-validation.mjs'
      - 'docs/STAGE3_INTEGRATION_COVERAGE.md'
      - '.github/workflows/stage3-production-integration-inventory.yml'
      - '.github/workflows/stage3-integration-coverage-validation.yml'
  push:
    branches: [ops/stage3-integration-coverage-matrix]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --workspace @hydroland/api run db:generate
      - name: Validate Stage 3 integration coverage, route, and authorization contracts
        run: node apps/api/scripts/stage3-integration-coverage-validation.mjs
      - name: Validate Stage 3 readiness payload contracts
        run: node apps/api/scripts/stage3-readiness-payload-contract-validation.mjs
      - name: Validate existing integration safeguards
        run: node apps/api/scripts/integration-readiness-validation.mjs
      - name: API typecheck
        run: npm --workspace @hydroland/api run typecheck
      - name: API build
        run: npm --workspace @hydroland/api run build
