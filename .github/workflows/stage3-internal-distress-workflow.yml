name: Stage 3 Internal Distress Workflow

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/safety/safety-distress.service.ts'
      - 'apps/api/src/safety/safety-incidents.controller.ts'
      - 'apps/api/src/safety/safety-incidents.service.ts'
      - 'apps/api/src/safety/safety.module.ts'
      - 'apps/api/src/integrations/marinetraffic-ais.service.ts'
      - 'apps/api/scripts/internal-distress-workflow-validation.mjs'
      - 'docs/STAGE3_INTEGRATION_COVERAGE.md'
      - '.github/workflows/stage3-internal-distress-workflow.yml'
  push:
    branches: [feat/stage3-internal-distress-workflow]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --workspace @hydroland/api run db:generate
      - name: Validate fail-safe internal maritime distress workflow
        run: node apps/api/scripts/internal-distress-workflow-validation.mjs
      - name: Validate existing integration safeguards
        run: node apps/api/scripts/integration-readiness-validation.mjs
      - name: API typecheck
        run: npm --workspace @hydroland/api run typecheck
      - name: API build
        run: npm --workspace @hydroland/api run build
