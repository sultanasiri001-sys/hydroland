name: A07 technology request acceptance

on:
  pull_request:
    paths:
      - 'apps/api/src/technology-security/**'
      - 'apps/api/scripts/technology-request*'
      - 'apps/web/src/hydroland-technology-requests.js'
      - 'apps/web/src/hydroland-account-center.js'
      - 'apps/web/e2e/technology-requests.spec.js'
      - '.github/workflows/technology-requests-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hydroland
          POSTGRES_PASSWORD: hydroland
          POSTGRES_DB: hydroland
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hydroland -d hydroland"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://hydroland:hydroland@127.0.0.1:5432/hydroland
      A07_HTTP_CONFIRM: CREATE_NEW_LOOPBACK_DATABASE_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --workspace=@hydroland/api --workspace=@hydroland/web --include-workspace-root=true
      - run: npm run db:generate -w @hydroland/api
      - run: npm run lint -w @hydroland/api
      - run: npm run build -w @hydroland/api
      - name: Domain authority and evidence contracts
        run: node --test apps/api/scripts/technology-request.test.cjs
      - name: Actual HTTP sessions, native IAM and isolated PostgreSQL
        run: node apps/api/scripts/technology-request-http-e2e.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Technology interface browser acceptance
        run: npm run test:e2e -w @hydroland/web -- technology-requests.spec.js --output=test-results-technology-requests
      - name: Retain focused failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a07-failure-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/web/test-results-technology-requests/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3
