name: Production Prisma Recovery

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ROLLBACK_FAILED_MIGRATION to confirm production migration recovery'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-prisma-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ inputs.confirm == 'ROLLBACK_FAILED_MIGRATION' }}
    runs-on: ubuntu-latest
    environment: production-e2e
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require production database secret
        run: test -n "$DATABASE_URL"

      - name: Install API dependencies
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Recover known failed migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in \
            20260919150000_trip_intelligence_foundation \
            20260919161500_translation_packs_preferences
          do
            output="$(npx prisma migrate resolve --rolled-back "$migration" 2>&1)" || {
              if echo "$output" | grep -qiE "not in a failed state|cannot be rolled back|P3012"; then
                echo "$migration does not require rollback recovery."
              else
                echo "$output"
                exit 1
              fi
            }
          done

      - name: Deploy pending migrations
        run: npx prisma migrate deploy
