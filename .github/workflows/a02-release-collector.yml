name: A02 full release policy gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: a02-full-policy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collector-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --workspace=@hydroland/api --include-workspace-root=true --ignore-scripts
      - name: Verify strict collector, full gate and source binding contracts
        run: |
          node --check scripts/a02-full-release-gate.mjs
          node --test scripts/a02-release-*.test.mjs scripts/a02-full-release-gate.test.mjs
  a02-full-release:
    needs: collector-contracts
    if: always()
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Refuse failed or skipped prerequisite
        if: needs.collector-contracts.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --workspace=@hydroland/api --include-workspace-root=true --ignore-scripts
      - name: Verify pinned source and full exact-main-push evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/a02-full-release-gate.mjs
