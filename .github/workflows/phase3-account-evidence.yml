name: Phase 3 account evidence

on:
  workflow_dispatch:
    inputs:
      deployment_sha:
        description: Exact approved API deployment commit to observe
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase3-account-evidence.yml'
      - 'scripts/phase3-public-evidence.mjs'

permissions:
  contents: read

jobs:
  public-observation:
    name: Public deployment observation (not full acceptance)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      # A PR observes its already-approved base, never the unmerged PR deployment.
      PHASE3_EXPECTED_DEPLOYMENT_SHA: ${{ inputs.deployment_sha || github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Observe deployment, providers and guest authorization
        run: node scripts/phase3-public-evidence.mjs
      - name: Preserve sanitized public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-public-observation-${{ github.run_id }}
          path: phase3-evidence/public-observation.json
          retention-days: 14
          if-no-files-found: error

  browser-regression:
    name: Fresh isolated browser regression (not live account acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run test -w @hydroland/web
      - run: npm run build -w @hydroland/web
      - run: npx playwright install --with-deps chromium
      - name: Existing complete browser suite with isolated fixtures
        run: |
          set -o pipefail
          npm run test:e2e -w @hydroland/web | tee phase3-browser-regression.txt
      - name: Preserve fixture browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-fixture-browser-${{ github.run_id }}
          path: |
            phase3-browser-regression.txt
            apps/web/test-results/**/account-*.png
          retention-days: 14
          if-no-files-found: error
