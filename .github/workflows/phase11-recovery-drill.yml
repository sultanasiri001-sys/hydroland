name: Phase 11 recovery drill

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/api/prisma/**'
      - 'apps/api/prisma-fresh-install-candidate/**'
      - 'apps/api/scripts/fresh-install-candidate.mjs'
      - 'apps/api/scripts/raw-domain-completion.mjs'
      - 'apps/api/scripts/candidate-column-completion.mjs'
      - 'apps/api/scripts/candidate-index-completion.mjs'
      - 'apps/api/scripts/candidate-constraint-completion.mjs'
      - 'apps/api/scripts/production-column-compatibility*'
      - 'apps/api/scripts/production-relation-compatibility*'
      - 'apps/api/scripts/organization-forward-recovery-probe.mjs'
      - 'apps/api/scripts/recovery-rehearsal.mjs'
      - 'apps/api/scripts/bootstrap-*-runtime-schema.mjs'
      - '.github/workflows/phase11-recovery-drill.yml'
      - 'docs/PRODUCTION_RECOVERY_RUNBOOK.md'
  push:
    branches: [main]
    paths:
      - 'apps/api/prisma/**'
      - 'apps/api/prisma-fresh-install-candidate/**'
      - 'apps/api/scripts/fresh-install-candidate.mjs'
      - 'apps/api/scripts/raw-domain-completion.mjs'
      - 'apps/api/scripts/candidate-column-completion.mjs'
      - 'apps/api/scripts/candidate-index-completion.mjs'
      - 'apps/api/scripts/candidate-constraint-completion.mjs'
      - 'apps/api/scripts/production-column-compatibility*'
      - 'apps/api/scripts/production-relation-compatibility*'
      - 'apps/api/scripts/organization-forward-recovery-probe.mjs'
      - 'apps/api/scripts/recovery-rehearsal.mjs'
      - 'apps/api/scripts/bootstrap-*-runtime-schema.mjs'
      - '.github/workflows/phase11-recovery-drill.yml'
      - 'docs/PRODUCTION_RECOVERY_RUNBOOK.md'
  schedule:
    - cron: '30 3 * * 0'

permissions:
  contents: read

jobs:
  restore-drill:
    name: restore-drill (${{ matrix.baseline }})
    strategy:
      fail-fast: false
      matrix:
        baseline: [GENERATED_REFERENCE, VERSIONED_CANDIDATE, VERSIONED_CANDIDATE_WITH_ORGANIZATIONS]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      RECOVERY_REHEARSAL_CONFIRM: DISPOSABLE_LOCAL_ONLY
      RECOVERY_BASELINE_SOURCE: ${{ matrix.baseline }}
      DATABASE_URL: postgresql://hydroland:hydroland@127.0.0.1:5432/hydroland_rehearsal_source?schema=public
    steps:
      - uses: actions/checkout@v4
      - name: Read exact organization candidate migrations
        if: matrix.baseline == 'VERSIONED_CANDIDATE_WITH_ORGANIZATIONS'
        uses: actions/checkout@v4
        with:
          ref: e6efbf0c2b8c2de52bfcee85b8a3ec2e03259c5b
          path: portal-candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start explicitly disposable PostgreSQL 18
        run: |
          docker run -d --name phase11-postgres \
            --label hydroland.recovery=disposable-local \
            -e POSTGRES_USER=hydroland \
            -e POSTGRES_PASSWORD=hydroland \
            -e POSTGRES_DB=hydroland_rehearsal_source \
            -p 127.0.0.1:5432:5432 \
            postgres:18
          for attempt in $(seq 1 60); do
            if docker exec phase11-postgres pg_isready -h 127.0.0.1 -U hydroland -d hydroland_rehearsal_source >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs phase11-postgres
          exit 1
      - name: Install locked dependencies and generate ORM
        run: |
          node --test apps/api/scripts/production-column-compatibility.test.mjs apps/api/scripts/production-relation-compatibility.test.mjs
          npm ci --ignore-scripts
          npm run db:generate --workspace=@hydroland/api
      - name: Execute current-schema backup and two isolated restores
        run: node apps/api/scripts/recovery-rehearsal.mjs
      - name: Retain sanitized rehearsal evidence, not database backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-recovery-drill-${{ matrix.baseline }}-${{ github.run_id }}
          path: phase11-recovery-evidence/*.json
          retention-days: 30
          if-no-files-found: error
      - name: Remove only the labelled disposable container
        if: always()
        run: |
          if [ "$(docker inspect --format '{{ index .Config.Labels "hydroland.recovery" }}' phase11-postgres 2>/dev/null)" = 'disposable-local' ]; then
            docker rm -fv phase11-postgres
          fi
