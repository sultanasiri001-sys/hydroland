name: Dependency lock audit

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**/package.json'
      - 'scripts/release-dependency-audit*'
      - '.github/workflows/dependency-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-and-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate committed lock by clean scoped installation
        run: npm ci --workspace=@hydroland/api --workspace=@hydroland/web --include-workspace-root=true --ignore-scripts
      - name: Reject lockfile mutation
        run: git diff --exit-code -- package-lock.json
      - name: Audit web/API release lock
        run: node scripts/release-dependency-audit.mjs web-api audit.json
      - name: Upload committed lockfile and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-api-lock-audit
          path: |
            package-lock.json
            audit.json
          retention-days: 7
