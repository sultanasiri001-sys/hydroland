appId: com.hydroland.acceptance
name: Seven native product journeys in Arabic and English using isolated synthetic HTTP
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- extendedWaitUntil:
    visible:
      id: home-login
    timeout: 30000
- tapOn:
    id: home-login
- scrollUntilVisible:
    element:
      id: login-email
    direction: DOWN
    visibilityPercentage: 100
    timeout: 20000
- tapOn:
    id: login-email
# Maestro iOS reads AX hasFocus, which is not reliably keyboard focus for RN
# TextInput (upstream issue #2842). Validate native focus on Android only.
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: login-email
          focused: true
- inputText: qa-mobile@example.test
# Dismiss the email keyboard before targeting the lower password field. On the
# 320px Android device it otherwise covers that field and receives the tap.
# On iOS the default center-screen swipes land inside this email field. Tap the
# non-interactive title, then retain hideKeyboard's native dismissal check.
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            text: '^تسجيل الدخول$'
          direction: UP
          visibilityPercentage: 100
          timeout: 20000
      - tapOn:
          text: '^تسجيل الدخول$'
- hideKeyboard
- assertVisible:
    id: login-email
    text: '^qa-mobile@example[.]test$'
- scrollUntilVisible:
    element:
      id: login-password
    direction: DOWN
    visibilityPercentage: 100
    timeout: 20000
- tapOn:
    id: login-password
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: login-password
          focused: true
- inputText: NativeFixtureOnly!123
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
