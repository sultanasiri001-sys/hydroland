- hideKeyboard
- scrollUntilVisible:
    element:
      id: login-email
    direction: UP
    visibilityPercentage: 100
    timeout: 20000
- assertVisible:
    id: login-email
    text: '^qa-mobile@example[.]test$'
- scrollUntilVisible:
